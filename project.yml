name: Mainstream
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MainstreamCore:
    path: Core
targets:
  Mainstream:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - package: MainstreamCore
        product: MainstreamCore
      - target: MainstreamShare
    info:
      path: Sources/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
    entitlements:
      path: Mainstream.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    settings:
      base:
        PRODUCT_NAME: Mainstream
        PRODUCT_BUNDLE_IDENTIFIER: com.local.mainstream
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Mainstream
        INFOPLIST_KEY_NSCameraUsageDescription: Receives data shown on another screen and takes photos to send.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Records audio to send.
        INFOPLIST_KEY_NSContactsUsageDescription: Adds contacts you receive.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Saves photos and videos you receive.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Sends your current location when you choose to.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  MainstreamShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared
    dependencies:
      - package: MainstreamCore
        product: MainstreamCore
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Mainstream
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: MainstreamShare
        PRODUCT_BUNDLE_IDENTIFIER: com.local.mainstream.share
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Mainstream:
    build:
      targets:
        Mainstream: all
    run:
      config: Release
    archive:
      config: Release
