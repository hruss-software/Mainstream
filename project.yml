name: App
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LinkCore:
    path: Core
targets:
  App:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: LinkCore
        product: LinkCore
    settings:
      base:
        PRODUCT_NAME: App
        PRODUCT_BUNDLE_IDENTIFIER: com.local.opticallink
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: " "
        INFOPLIST_KEY_NSCameraUsageDescription: Receives data shown on another screen and takes photos to send.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Receives data sent as sound and records audio to send.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Release
    archive:
      config: Release
