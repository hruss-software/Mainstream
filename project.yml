name: Photon
options:
  bundleIdPrefix: com.photon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PhotonCore:
    path: PhotonCore
targets:
  Photon:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: PhotonCore
        product: PhotonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photon.link
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photon
        INFOPLIST_KEY_NSCameraUsageDescription: Receives data shown on another screen.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Records audio to send.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Photon:
    build:
      targets:
        Photon: all
    run:
      config: Release
    archive:
      config: Release
